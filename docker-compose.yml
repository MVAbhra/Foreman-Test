services:

  mysql:

    image: mysql:8.0

    container_name: foreman-mysql

    environment:

      MYSQL_ROOT_PASSWORD: 9433

      MYSQL_DATABASE: foreman_backend

    ports:

      - "3306:3306"

  backend:

    image: foreman-backend

    container_name: foreman-backend

    ports:

      - "8080:8080"

    environment:

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/foreman_backend?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

      SPRING_DATASOURCE_USERNAME: root

      SPRING_DATASOURCE_PASSWORD: 9433

    depends_on:

      - mysql